<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087f5b">
  <meta name="description" content="MENA — Connect, Discover, Buy, Sell and Grow">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>MENA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">
  <button class="brand" data-page="home">
    <span class="logo">M</span>
    <strong>MENA</strong>
  </button>

  <div class="top-actions">
    <button id="searchBtn" class="icon-btn">⌕</button>
    <button id="settingsBtn" class="icon-btn">⚙</button>
  </div>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <button data-page="home">
    <span>⌂</span>
    <small>Home</small>
  </button>

  <button data-page="friends">
    <span>♧</span>
    <small>Friends</small>
  </button>

  <button id="createBtn" class="create-btn">
    ＋
  </button>

  <button data-page="inbox">
    <span>▣</span>
    <small>Inbox</small>
  </button>

  <button data-page="profile">
    <span>◯</span>
    <small>Profile</small>
  </button>
</nav>

<input
  id="mediaInput"
  type="file"
  accept="image/*,video/*"
  capture="environment"
  hidden
>

<input
  id="avatarInput"
  type="file"
  accept="image/*"
  hidden
>

<div id="modal" class="modal hidden"></div>

<script src="script.js"></script>

</body>
</html>
