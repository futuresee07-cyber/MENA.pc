<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#087f5b">
  <meta
    name="description"
    content="MENA — Social, Marketplace and Free Work"
  >

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>MENA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div id="app">

    <!-- TOP BAR -->
    <header class="topbar">

      <button class="brand-btn" data-page="home">
        <span class="mena-logo">M</span>

        <span class="brand-name">MENA</span>
      </button>

      <div class="top-actions">

        <button
          class="top-icon"
          id="searchBtn"
          aria-label="Search"
        >
          🔎
        </button>

        <button
          class="top-icon"
          id="settingsBtn"
          aria-label="Settings"
        >
          ⚙
        </button>

      </div>

    </header>


    <!-- MAIN CONTENT -->
    <main id="mainContent"></main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-page="home"
      >
        <span class="nav-icon">⌂</span>
        <small>Home</small>
      </button>


      <button
        class="nav-item"
        data-page="market"
      >
        <span class="nav-icon">🛍</span>
        <small>Marketplace</small>
      </button>


      <button
        id="createBtn"
        class="create-button"
        aria-label="Create post"
      >
        <span>＋</span>
      </button>


      <button
        class="nav-item"
        data-page="inbox"
      >
        <span class="nav-icon">✉</span>
        <small>Inbox</small>
      </button>


      <button
        class="nav-item"
        data-page="profile"
      >
        <span class="nav-icon">◯</span>
        <small>Profile</small>
      </button>

    </nav>

  </div>


  <!-- MEDIA INPUT -->
  <input
    id="mediaInput"
    type="file"
    accept="image/*,video/*"
    capture="environment"
    hidden
  >


  <!-- AVATAR INPUT -->
  <input
    id="avatarInput"
    type="file"
    accept="image/*"
    hidden
  >


  <!-- MODAL -->
  <div
    id="modal"
    class="modal hidden"
  ></div>


  <script src="script.js"></script>

</body>
</html>
