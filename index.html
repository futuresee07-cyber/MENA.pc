<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#087f5b"
  >

  <meta
    name="description"
    content="MENA — Connect, Discover, Buy, Sell and Grow"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <title>MENA</title>

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">

    <button
      class="brand"
      data-page="home"
      type="button"
      aria-label="MENA home"
    >
      <span class="logo">M</span>
      <strong>MENA</strong>
    </button>

    <div class="top-actions">

      <button
        id="searchBtn"
        class="icon-btn"
        type="button"
        aria-label="Search"
      >
        ⌕
      </button>

      <button
        id="settingsBtn"
        class="icon-btn"
        type="button"
        aria-label="Settings"
      >
        ⚙
      </button>

    </div>

  </header>


  <!-- APP -->
  <main
    id="app"
    aria-live="polite"
  ></main>


  <!-- TIKTOK-STYLE BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button
      data-page="home"
      type="button"
    >
      <span>⌂</span>
      <small>Home</small>
    </button>


    <button
      data-page="friends"
      type="button"
    >
      <span>♧</span>
      <small>Friends</small>
    </button>


    <button
      id="createBtn"
      class="create-btn"
      type="button"
      aria-label="Create"
    >
      ＋
    </button>


    <button
      data-page="inbox"
      type="button"
    >
      <span>▣</span>
      <small>Inbox</small>
    </button>


    <button
      data-page="profile"
      type="button"
    >
      <span>◯</span>
      <small>Profile</small>
    </button>

  </nav>


  <!-- POST MEDIA -->
  <input
    id="mediaInput"
    type="file"
    accept="image/*,video/*"
    capture="environment"
    hidden
  >


  <!-- PROFILE PHOTO -->
  <input
    id="avatarInput"
    type="file"
    accept="image/*"
    hidden
  >


  <!-- GLOBAL MODAL -->
  <div
    id="modal"
    class="modal hidden"
    aria-hidden="true"
  ></div>


  <!-- MAIN JAVASCRIPT -->
  <script src="script.js"></script>

</body>

</html>
