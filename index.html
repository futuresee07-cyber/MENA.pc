<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#087f5b"
  >

  <meta
    name="description"
    content="MENA — Social, Marketplace, Free Work and Creator Platform"
  >

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>MENA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- TOP BAR -->

  <header class="topbar">

    <button
      class="brand"
      onclick="showPage('home')"
      aria-label="MENA Home"
    >
      <span class="logo">M</span>

      <span class="brand-text">
        <strong>MENA</strong>
        <small>Connect • Create • Grow</small>
      </span>
    </button>

    <div class="top-actions">

      <button
        class="icon-btn"
        onclick="openSearch()"
        aria-label="Search"
      >
        🔎
      </button>

      <button
        class="icon-btn"
        onclick="openSettings()"
        aria-label="Settings"
      >
        ⚙️
      </button>

    </div>

  </header>


  <!-- APP -->

  <main id="app"></main>


  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <button
      data-page="home"
      onclick="showPage('home')"
    >
      <span>⌂</span>
      <small>Home</small>
    </button>


    <button
      data-page="market"
      onclick="showPage('market')"
    >
      <span>🛍</span>
      <small>Market</small>
    </button>


    <button
      id="createBtn"
      class="create-btn"
      onclick="openCreatePost()"
      aria-label="Create"
    >
      ＋
    </button>


    <button
      data-page="inbox"
      onclick="showPage('inbox')"
    >
      <span>💬</span>
      <small>Inbox</small>
    </button>


    <button
      data-page="profile"
      onclick="showPage('profile')"
    >
      <span>◯</span>
      <small>Profile</small>
    </button>

  </nav>


  <!-- FILE INPUTS -->

  <input
    id="mediaInput"
    type="file"
    accept="image/*,video/*"
    capture="environment"
    hidden
  >

  <input
    id="avatarInput"
    type="file"
    accept="image/*"
    hidden
  >


  <!-- MODAL -->

  <div
    id="modal"
    class="modal hidden"
  ></div>


  <script src="script.js"></script>

</body>
</html>
